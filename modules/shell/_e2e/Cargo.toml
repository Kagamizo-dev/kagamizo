[package]
name = "kagamizo-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shell-e2e"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
