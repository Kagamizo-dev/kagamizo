[package]
name = "media"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "media-index"
path = "src/bin/media-index.rs"

[[bin]]
name = "media-render"
path = "src/bin/media-render.rs"

[profile.release]
strip = true
