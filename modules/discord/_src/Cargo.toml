[package]
name = "discord-relay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[profile.release]
strip = true
