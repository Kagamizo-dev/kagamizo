[package]
name = "trade-run"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "trade-run"
path = "src/main.rs"

[dependencies]
kagamizo-public = { path = "../public" }
kagamizo-weather.workspace = true
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
