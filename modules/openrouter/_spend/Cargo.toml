[package]
name = "agent-spend"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "agent-spend"
path = "src/main.rs"

[[bin]]
name = "openrouter"
path = "src/openrouter.rs"

[dependencies]
ureq = { version = "2", features = ["json", "native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
