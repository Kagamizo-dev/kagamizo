[package]
name = "browser"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
p256 = { version = "0.13", features = ["pkcs8", "std"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-std", "io-util"] }
zeroize = "1"

[profile.release]
strip = true
