<!doctype html>
<title>Sign in</title>
<h1>Sign in</h1>
<form onsubmit="event.preventDefault(); document.getElementById('done').hidden = false; history.pushState({}, '', '/done');">
  <label>Email <input id="email" type="email"></label>
  <label>Password <input id="password" type="password"></label>
  <button type="submit">Continue</button>
</form>
<p id="done" hidden role="status"><span>Signed in</span><button type="button">Invite member</button></p>
