[package]
name = "bank-audit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Audits transaction history across accounts: recurring charges, where each rests, duplicates, fees, what to consolidate"

[dependencies]
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[profile.release]
strip = true
