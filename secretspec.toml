# Generated from each module's secrets.profiles (modules/proton/secretspec.nix); edit those, not this.
# Values never live here: only names, descriptions and Proton Pass item titles.

[profiles.agent.CLOUDFLARE_API_TOKEN]
description = "agent-readonly token, minted by bootstrap"

[profiles.agent.CLOUDFLARE_API_TOKEN.ref]
item = "cloudflare-token"

[profiles.agent.OPENROUTER_API_KEY]
description = "OpenRouter key for the agent fleet"
required = false

[profiles.agent.OPENROUTER_API_KEY.ref]
item = "openrouter-api-key"

[profiles.agent.TOFU_STATE]
description = "The encrypted OpenTofu state, written by `infra ci apply`"
providers = ["state"]
required = false

[profiles.agent.TOFU_STATE.ref]
item = "tofu-state"

[profiles.agent.TOFU_STATE_PASSPHRASE]
description = "Encrypts the OpenTofu state and plans"
providers = ["state"]

[profiles.agent.TOFU_STATE_PASSPHRASE.ref]
item = "tofu-state-passphrase"

[profiles.agent.defaults]
providers = ["agents"]

[profiles.ci.CLOUDFLARE_API_TOKEN]
description = "ci-apply token, minted by bootstrap"

[profiles.ci.CLOUDFLARE_API_TOKEN.ref]
item = "cloudflare-token"

[profiles.ci.HCLOUD_TOKEN]
description = "Hetzner Cloud project token for OpenTofu and hcloud"
required = false

[profiles.ci.HCLOUD_TOKEN.ref]
item = "hcloud-token"

[profiles.ci.TOFU_STATE]
description = "The encrypted OpenTofu state, written by `infra ci apply`"
providers = ["state"]
required = false

[profiles.ci.TOFU_STATE.ref]
item = "tofu-state"

[profiles.ci.TOFU_STATE_PASSPHRASE]
description = "Encrypts the OpenTofu state and plans"
providers = ["state"]

[profiles.ci.TOFU_STATE_PASSPHRASE.ref]
item = "tofu-state-passphrase"

[profiles.ci.defaults]
providers = ["ci"]

[profiles.github.GITHUB_TOKEN]
description = "Fine-grained token administering the kagamizo GitHub organization"

[profiles.github.GITHUB_TOKEN.ref]
item = "github-token"

[profiles.github.defaults]
providers = ["kagamizo"]

[profiles.host.OPENROUTER_API_KEY]
description = "OpenRouter key for chat and code, minted by `openrouter keys`"
required = false

[profiles.host.OPENROUTER_API_KEY.ref]
item = "openrouter-api-key"

[profiles.host.TUNNEL_TOKEN]
description = "Cloudflare Tunnel token for chat and code, from the access layer"
required = false

[profiles.host.TUNNEL_TOKEN.ref]
item = "tunnel-token"

[profiles.host.defaults]
providers = ["host"]

[profiles.openrouter.OPENROUTER_MANAGEMENT_KEY]
description = "OpenRouter management key, made once in the dashboard (a Gap)"

[profiles.openrouter.OPENROUTER_MANAGEMENT_KEY.ref]
item = "openrouter-management-key"

[profiles.openrouter.defaults]
providers = ["kagamizo"]

[profiles.proton-agents.PROTON_PASS_AGENT_TOKEN]
description = "Proton Pass agent token `nix-images-plan`"

[profiles.proton-agents.PROTON_PASS_AGENT_TOKEN.ref]
item = "pass-agent-nix-images-plan"

[profiles.proton-agents.PROTON_PASS_CI_TOKEN]
description = "Proton Pass agent token `nix-images-ci`"

[profiles.proton-agents.PROTON_PASS_CI_TOKEN.ref]
item = "pass-agent-nix-images-ci"

[profiles.proton-agents.PROTON_PASS_HOST_TOKEN]
description = "Proton Pass agent token `kagamizo-host`"

[profiles.proton-agents.PROTON_PASS_HOST_TOKEN.ref]
item = "pass-agent-kagamizo-host"

[profiles.proton-agents.PROTON_PASS_ORCA_TOKEN]
description = "Proton Pass agent token `orca-fleet`"

[profiles.proton-agents.PROTON_PASS_ORCA_TOKEN.ref]
item = "pass-agent-orca-fleet"

[profiles.proton-agents.defaults]
providers = ["root"]

[project]
name = "nix-images"
revision = "1.0"

[providers]
agents = "protonpass://Kagamizo-Agents"
ci = "protonpass://Kagamizo-CI"
host = "protonpass://Kagamizo-Host"
kagamizo = "protonpass://Kagamizo-LLC"
root = "protonpass://Zachariah-Root"
state = "protonpass://Kagamizo-State"
