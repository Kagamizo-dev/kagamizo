[project]
name = "nix-images"
revision = "1.0"

[providers]
agents = "protonpass://Kagamizo-Agents"
cache = "protonpass://Kagamizo-Cache"
ci = "protonpass://Kagamizo-CI"
host = "protonpass://Kagamizo-Host"
host-state = "protonpass://Kagamizo-Host-State"
install = "protonpass://Kagamizo-Install"
jingzo-logins = "protonpass://Jingzo-LLC"
jingzo-sessions = "protonpass://Jingzo-LLC-Sessions"
kagamizo = "protonpass://Kagamizo-LLC"
kagamizo-logins = "protonpass://Kagamizo-LLC"
kagamizo-sessions = "protonpass://Kagamizo-LLC-Sessions"
mirazo-logins = "protonpass://Mirazo-Root"
mirazo-sessions = "protonpass://Mirazo-Root-Sessions"
root = "protonpass://Mirazo-Root"
state = "protonpass://Kagamizo-State"
