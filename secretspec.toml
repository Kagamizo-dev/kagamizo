# Which secrets each role needs, and which Proton Pass vault holds them.
# Values never live here: only names, descriptions and item titles.
#
# One profile per vault, one vault per trust level. Whoever holds a vault's
# Proton Pass agent token gets that profile's view and nothing else. Every
# profile uses the same variable names, so tools see one CLOUDFLARE_API_TOKEN
# whose power depends only on which profile resolved it.
#
#   secretspec run --profile agent -- <command>
#
# See infra/README.md for creating the vaults, items and agent tokens.

[project]
name = "nix-images"
revision = "1.0"

[providers]
personal = "protonpass://nix-images-root"
ci = "protonpass://nix-images-ci"
agents = "protonpass://nix-images-agents"

# Yours only: run by hand to mint or rotate the token profiles.
[profiles.bootstrap.defaults]
providers = ["personal"]

[profiles.bootstrap]
CLOUDFLARE_API_TOKEN = { description = "Root token that can create API tokens (dashboard template: Create Additional Tokens)", ref = { item = "cloudflare-token" } }
AWS_ACCESS_KEY_ID = { description = "R2 state bucket key ID, read and write", ref = { item = "r2-state-key-id" } }
AWS_SECRET_ACCESS_KEY = { description = "R2 state bucket secret, read and write", ref = { item = "r2-state-secret" } }
TOFU_STATE_PASSPHRASE = { description = "Encrypts the bootstrap layer state (holds token values)", ref = { item = "tofu-state-passphrase" } }

# GitHub Actions on master, behind the `cloudflare` environment.
[profiles.ci.defaults]
providers = ["ci"]

[profiles.ci]
CLOUDFLARE_API_TOKEN = { description = "ci-apply token from infra/bootstrap", ref = { item = "cloudflare-token" } }
AWS_ACCESS_KEY_ID = { description = "R2 state bucket key ID, read and write", ref = { item = "r2-state-key-id" } }
AWS_SECRET_ACCESS_KEY = { description = "R2 state bucket secret, read and write", ref = { item = "r2-state-secret" } }
TOFU_STATE_PASSPHRASE = { description = "Encrypts the cloudflare layer state", ref = { item = "tofu-state-passphrase" } }

# The agent fleet (Orca) and PR plans: read everything, change nothing.
[profiles.agent.defaults]
providers = ["agents"]

[profiles.agent]
CLOUDFLARE_API_TOKEN = { description = "agent-readonly token from infra/bootstrap", ref = { item = "cloudflare-token" } }
AWS_ACCESS_KEY_ID = { description = "R2 state bucket key ID, read only", ref = { item = "r2-state-key-id" } }
AWS_SECRET_ACCESS_KEY = { description = "R2 state bucket secret, read only", ref = { item = "r2-state-secret" } }
TOFU_STATE_PASSPHRASE = { description = "Same value as in the ci vault, so plans can read the cloudflare layer state", ref = { item = "tofu-state-passphrase" } }
OPENROUTER_API_KEY = { description = "OpenRouter key for the agent fleet", required = false, ref = { item = "openrouter-api-key" } }
