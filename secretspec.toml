[profiles.agent.TOFU_STATE_PASSPHRASE.ref]
item = "tofu-state-passphrase"

[profiles.agent.defaults]
providers = ["agents"]

[profiles.ci.AWS_ACCESS_KEY_ID]
description = "R2 state bucket key ID, read and write"

[profiles.ci.AWS_ACCESS_KEY_ID.ref]
item = "r2-state-key-id"

[profiles.ci.AWS_SECRET_ACCESS_KEY]
description = "R2 state bucket secret, read and write"

[profiles.ci.AWS_SECRET_ACCESS_KEY.ref]
item = "r2-state-secret"

[profiles.ci.CLOUDFLARE_API_TOKEN]
description = "ci-apply token, minted by bootstrap"

[profiles.ci.CLOUDFLARE_API_TOKEN.ref]
item = "cloudflare-token"

[profiles.ci.TOFU_STATE_PASSPHRASE]
description = "Encrypts the cloudflare layer state"

[profiles.ci.TOFU_STATE_PASSPHRASE.ref]
item = "tofu-state-passphrase"

[profiles.ci.defaults]
