# Generated by modules/ci from ci.workflows.checks; do not edit.
# Every flake check (formats, lints, Lean, Cedar, the NixOS VM tests), the workflow files and the commit messages.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  commits:
    name: commit messages (Sentry conventions)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      with:
        extra_nix_config: accept-flake-config = true
    - env:
        RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha,
          github.event.pull_request.head.sha) || (github.event.before == '0000000000000000000000000000000000000000'
          && github.sha || format('{0}..{1}', github.event.before, github.sha)) }}
      name: commit-lint
      run: nix run .#commit-lint -- "$RANGE"
    timeout-minutes: 10
  flake:
    name: flake check (format, lint, Lean, VM tests)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        && df -h /
    - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      with:
        extra_nix_config: accept-flake-config = true
    - name: nix flake check
      run: nix flake check --print-build-logs
    - if: always()
      name: Upload VM test screenshots
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: ignore
        name: vm-test-screenshots
        path: result*/*.png
    timeout-minutes: 90
  workflows:
    name: lint workflows (actionlint, zizmor)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      with:
        extra_nix_config: accept-flake-config = true
    - run: nix run nixpkgs#actionlint
    - run: nix run nixpkgs#zizmor -- --offline .github/workflows
    timeout-minutes: 10
name: checks
'on':
  pull_request: {}
  push:
    branches-ignore:
    - main
  workflow_call: {}
permissions: {}
