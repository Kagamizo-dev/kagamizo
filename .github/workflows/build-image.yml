name: build-image

on:
  push:
    branches: [beta]
    paths-ignore: ["README.md", "tests/**"]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04-arm # native aarch64, no emulation
    timeout-minutes: 120
    permissions:
      contents: write # publish the release asset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build SD images
        run: |
          nix build --print-build-logs --out-link result-ephemeral .#image
          nix build --print-build-logs --out-link result-persistent .#image-persistent

      - name: Package as .zip (Android can unzip it; EtchDroid needs a raw .img)
        run: |
          set -euo pipefail
          mkdir -p out
          for v in ephemeral persistent; do
            zstd -d --stdout result-$v/sd-image/*.img.zst > out/rpi5-nixos-$v.img
            (cd out && zip -1 rpi5-nixos-$v.img.zip rpi5-nixos-$v.img)
            rm out/rpi5-nixos-$v.img
          done
          ls -lh out

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="rpi5-${REF_NAME//\//-}"
          notes="Unzip, then flash the .img (EtchDroid / dd / Pi Imager). rpi5-nixos-ephemeral = RAM-only root, wipes on power-off (default). rpi5-nixos-persistent = normal writable SD, fallback. Built from $GITHUB_SHA."
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --title "Pi 5 images ($REF_NAME)" --notes "$notes"
          gh release upload "$tag" out/*.zip --clobber
          gh release edit "$tag" --notes "$notes"
