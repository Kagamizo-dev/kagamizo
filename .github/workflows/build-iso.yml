name: build-iso

on:
  push:
    branches: [master, claude/rpi5-nixos-image]
    paths-ignore: ["README.md", "tests/**"]
  workflow_dispatch:

permissions: {}

jobs:
  iso:
    runs-on: ubuntu-latest # x86_64 with KVM
    timeout-minutes: 90
    permissions:
      contents: write # publish the release asset
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Build ISO
        run: nix build --print-build-logs --out-link result .#yoga-iso

      - name: Boot the ISO in QEMU (UEFI, as a USB stick)
        run: ./scripts/boot-iso.sh result/iso/*.iso 600

      - name: Check size against the 2 GB release-asset limit
        id: size
        run: |
          set -euo pipefail
          mkdir -p out
          cp result/iso/*.iso out/yoga-c940-ephemeral.iso
          bytes=$(stat -c %s out/yoga-c940-ephemeral.iso)
          echo "ISO is $bytes bytes"
          if [ "$bytes" -gt 2000000000 ]; then echo "big=true" >> "$GITHUB_OUTPUT"; else echo "big=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish release asset
        if: steps.size.outputs.big == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="yoga-${REF_NAME//\//-}"
          notes="Flash yoga-c940-ephemeral.iso straight to a USB stick (EtchDroid / dd). Live and ephemeral: nothing is written to the laptop. Built from $GITHUB_SHA."
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target "$GITHUB_SHA" --title "Yoga C940 ISO ($REF_NAME)" --notes "$notes"
          gh release upload "$tag" out/yoga-c940-ephemeral.iso --clobber
          gh release edit "$tag" --notes "$notes"

      - name: Upload as workflow artifact (too big for a release asset)
        if: steps.size.outputs.big == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yoga-c940-ephemeral-iso
          path: out/yoga-c940-ephemeral.iso
          retention-days: 14
          compression-level: 0
