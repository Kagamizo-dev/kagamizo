name: infra

# PRs get a plan made with the read-only agent view; merging to main applies
# it with the ci view. The only GitHub secrets are two Proton Pass agent
# tokens; everything else is resolved from Proton Pass by secretspec.
on:
  pull_request:
    paths:
      - modules/_lib/**
      - modules/cloudflare/**
      - modules/identity/**
      - modules/github/**
      - modules/catalog/**
      - secretspec.toml
      - flake.nix
      - flake.lock
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - modules/_lib/**
      - modules/cloudflare/**
      - modules/identity/**
      - modules/github/**
      - modules/catalog/**
      - secretspec.toml
      - flake.nix
      - flake.lock
      - .github/workflows/infra.yml

permissions: {}

env:
  # Runners are throwaway, so a file-backed pass-cli session is fine.
  PROTON_PASS_KEY_PROVIDER: fs

jobs:
  plan:
    name: plan (agent view, read only)
    # Off until setup is done (modules/cloudflare/README.md, step 7). Fork PRs get no
    # secrets, so only branches of this repo are planned.
    if: >-
      vars.INFRA_ENABLED == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: protonpass/install-cli-action@9a5ae5819440dc2cb1c154823193ea30f18926e3 # v1.1.0
        with:
          version: "2.4.2"

      - name: Log in to Proton Pass (agents vault, state as viewer)
        run: pass-cli login
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_AGENT_TOKEN }}

      - run: nix run .#infra -- agent plan -input=false -no-color
        env:
          SECRETSPEC_REASON: infra plan for a pull request

  apply:
    name: apply (ci view)
    if: vars.INFRA_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds PROTON_PASS_CI_TOKEN; restrict it to main in the repo settings.
    environment: cloudflare
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: protonpass/install-cli-action@9a5ae5819440dc2cb1c154823193ea30f18926e3 # v1.1.0
        with:
          version: "2.4.2"

      - name: Log in to Proton Pass (ci vault, state as editor)
        run: pass-cli login
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_CI_TOKEN }}

      # Writes the state back to the state vault; the concurrency group above
      # keeps two applies from racing on it.
      - run: nix run .#infra -- ci apply -input=false -auto-approve -no-color
        env:
          SECRETSPEC_REASON: infra apply from main
