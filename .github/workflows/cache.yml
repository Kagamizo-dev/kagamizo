# Generated by modules/ci from ci.workflows.cache; do not edit.
# Every check and package of the push, built and copied signed to the build cache (modules/cache), so machines pull instead of rebuilding.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  push:
    name: build and push to cache.kagamizo.com
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        && df -h /
    - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      with:
        extra_nix_config: accept-flake-config = true
    - uses: protonpass/install-cli-action@9a5ae5819440dc2cb1c154823193ea30f18926e3
      with:
        version: 2.4.2
    - env:
        PROTON_PASS_KEY_PROVIDER: fs
        PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_CACHE_TOKEN }}
      name: Log in to Proton Pass (cache vault)
      run: pass-cli login
    - env:
        PROTON_PASS_KEY_PROVIDER: fs
      name: cache-push
      run: nix run .#cache-push
    timeout-minutes: 180
name: cache
'on':
  push: {}
permissions: {}
