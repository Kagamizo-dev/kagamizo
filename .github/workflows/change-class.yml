# Generated by modules/ci from ci.workflows.change-class; do not edit.
# Which classes a pull request touches, and whether it may merge as it stands (the agents' classes alone, or with the owner's approval).
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  decide:
    name: change classes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      with:
        extra_nix_config: accept-flake-config = true
    - env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        RANGE: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
          && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
          || (github.event.before == '0000000000000000000000000000000000000000' &&
          github.sha || format('{0}..{1}', github.event.before, github.sha)) }}
        REPO: ${{ github.repository }}
      name: changes decide
      run: nix run .#changes-ci
    timeout-minutes: 10
name: change-class
'on':
  pull_request: {}
  pull_request_review:
    types:
    - submitted
permissions: {}
